name: Typechecking

on:
   pull_request:
      branches:
         - master
   push:
      branches:
         - master

jobs:
   test:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v6
           with:
              submodules: false
         - name: Set up Python
           uses: actions/setup-python@v6
           with:
              python-version: '3.x'
         - name: Install dependencies
           run: |
              python -m pip install --upgrade pip
              pip install -e .[test]
         - name: Install mypy
           run: |
              python -m pip install --upgrade pip
              pip install mypy
         - name: Run mypy
           run: |
              mypy src/koopmans/ --ignore-missing-imports
